<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html, body { height: 100%; }
body{margin:0;font-family:'Public Sans',ui-sans-serif,system-ui,sans-serif;background:#F6F4EE;overflow-x:hidden}
a{color:#2B3A67}a:hover{color:#C1502E}

.hidden { display: none !important; }
/* Some elements below (e.g. .auth-form) set their own `display`, which has
   the same specificity as the browser's default [hidden] rule and would
   otherwise win on source order — this keeps `hidden` authoritative. */
[hidden] { display: none !important; }

.app-shell {
  display: flex;
  width: 100%;
  min-height: 100vh;
  box-sizing: border-box;
  background: #F6F4EE;
}

.sidebar {
  width: 248px;
  flex-shrink: 0;
  background: #1F2A44;
  color: #F3F1E9;
  box-sizing: border-box;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.main {
  flex-grow: 1;
  box-sizing: border-box;
  padding: 36px 40px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  min-width: 0;
}

.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 58px;
  background: #fff;
  border: 1px solid #E1DDD1;
  border-radius: 16px;
  padding: 0 20px;
  box-shadow: 0 1px 2px rgba(20,20,15,0.04);
}

.source-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.content-row {
  display: flex;
  gap: 24px;
  flex-grow: 1;
  min-height: 0;
}

.results {
  flex-grow: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.result-card {
  display: flex;
  gap: 16px;
  padding: 16px;
  background: #fff;
  border: 1px solid #ECE8DC;
  border-radius: 12px;
}
a.result-card {
  text-decoration: none;
  color: inherit;
  transition: border-color 0.12s, box-shadow 0.12s;
}
a.result-card:hover {
  border-color: #C7C2B3;
  box-shadow: 0 1px 4px rgba(20,20,15,0.06);
}

.result-title-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.result-icon {
  width: 38px; height: 38px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.result-title { font-size: 15px; font-weight: 600; color: #1B1C20; }
.result-time { font-size: 11px; color: #8E8B80; }
.result-snippet {
  font-size: 13px; color: #6B675C; margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.result-meta-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.result-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600;
  border-radius: 6px; padding: 3px 8px;
}
.result-context { font-size: 12px; color: #B3AFA2; }
.empty-state {
  font-size: 13px; color: #8E8B80; padding: 28px; text-align: center;
  background: #fff; border: 1px dashed #E1DDD1; border-radius: 12px;
}

.filters {
  width: 268px;
  flex-shrink: 0;
  background: #fff;
  border: 1px solid #ECE8DC;
  border-radius: 14px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  height: fit-content;
}

/* connect-source dropdown (sidebar + source row share this) */
.connect-wrap { position: relative; display: inline-flex; }
.connect-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 190px;
  background: #fff; border: 1px solid #E1DDD1; border-radius: 10px; padding: 6px;
  box-shadow: 0 4px 16px rgba(20,20,15,0.12); z-index: 20;
}
.connect-menu.open { display: flex; flex-direction: column; gap: 2px; }
.connect-menu-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
  font-size: 13px; color: #1B1C20 !important; text-decoration: none;
}
.connect-menu-item:hover { background: #F6F4EE; }

/* dynamic sidebar "connected sources" rows */
.sidebar-source-row {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px;
  background: rgba(255,255,255,0.06);
}
.sidebar-source-row .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sidebar-source-label {
  font-size: 13px; color: #F3F1E9; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap; min-width: 0;
}
.sidebar-source-status { margin-left: auto; font-size: 11px; color: #8E8B80; flex-shrink: 0; }
.disconnect-btn, .resync-btn {
  background: none; border: none; color: #8E8B80; cursor: pointer; font-size: 14px;
  line-height: 1; padding: 2px 4px; flex-shrink: 0;
}
.disconnect-btn { font-size: 15px; }
.disconnect-btn:hover, .resync-btn:hover { color: #F3F1E9; }
.resync-btn:disabled { opacity: 0.4; cursor: default; }
.upload-btn:disabled { opacity: 0.6; cursor: default; }
.delete-doc-btn {
  margin-left: auto; border: none; background: transparent; cursor: pointer;
  font-size: 12px; color: #8E8B80; padding: 2px 6px; border-radius: 6px;
}
.delete-doc-btn:hover { color: #C1502E; background: #FBEDE7; }
.resync-btn.spinning { animation: findr-spin 0.8s linear infinite; display: inline-block; }
@keyframes findr-spin { to { transform: rotate(360deg); } }

/* dynamic source-row pills */
.source-pill {
  display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px;
  border-radius: 999px; background: #fff; border: 1px solid #E1DDD1; font-size: 13px; color: #1B1C20;
}
.source-pill .pill-dot { width: 6px; height: 6px; border-radius: 50%; margin-left: 2px; flex-shrink: 0; }

.user-avatar-btn {
  cursor: pointer; border: none; font: inherit; padding: 0;
  width:34px; height:34px; border-radius:50%; background:#C1502E; color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0;
}

/* login overlay */
.auth-screen {
  position: fixed; inset: 0; background: #F6F4EE;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 100;
}
.auth-card {
  width: 100%; max-width: 360px; background: #fff; border: 1px solid #ECE8DC;
  border-radius: 16px; padding: 32px 28px; box-shadow: 0 1px 2px rgba(20,20,15,0.04);
  display: flex; flex-direction: column; gap: 18px; box-sizing: border-box;
}
.auth-logo { display: flex; align-items: center; gap: 10px; }
.auth-title { margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; color: #1B1C20; }
.auth-subtitle { margin: 0; font-size: 13px; color: #6B675C; }
.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-form label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B5748; }
.auth-form input {
  height: 40px; border: 1px solid #E1DDD1; border-radius: 10px; padding: 0 12px;
  font-size: 14px; font-family: inherit; outline: none; background: #FBFAF6; box-sizing: border-box;
}
.auth-form input:focus { border-color: #2B3A67; }
.auth-submit {
  height: 42px; border: none; border-radius: 10px; background: #2B3A67; color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.auth-submit:hover { background: #1F2A44; }
.auth-error { font-size: 12px; color: #C0392B; }
.auth-hint { margin: 0; font-size: 12px; color: #8E8B80; text-align: center; }
.auth-hint code { background: #F6F4EE; border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }

/* Tablet: narrow the fixed-width columns before we start stacking. */
@media (max-width: 1200px) {
  .sidebar { width: 200px; }
  .filters { width: 220px; }
  .main { padding: 32px; }
}

/* Stack filters below results once there isn't room for three columns. */
@media (max-width: 960px) {
  .content-row { flex-direction: column; }
  .filters { width: 100%; }
}

/* Small screens: sidebar becomes a horizontal top bar. */
@media (max-width: 720px) {
  .app-shell { flex-direction: column; }
  .sidebar {
    width: 100%;
    flex-direction: row;
    align-items: center;
    padding: 14px 16px;
    gap: 16px;
    overflow-x: auto;
  }
  .sidebar-nav { flex-direction: row; gap: 4px; }
  .sidebar-sources { display: none; }
  .main { padding: 20px; gap: 16px; }
  .cmdk-hint { display: none; }
  .connect-wrap { flex-basis: 100%; }
}

@media (max-width: 480px) {
  .main h1 { font-size: 22px; }
  .search-bar { height: auto; padding: 10px 14px; flex-wrap: wrap; }
  .source-row { gap: 8px; }
  .source-row > * { font-size: 12px !important; padding-left: 10px !important; padding-right: 10px !important; }
}
</style>
</head>
<body>

<!-- LOGIN (no public sign-up — single seeded demo account) -->
<div id="login-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#2B3A67" stroke-width="2"></circle><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="#2B3A67" stroke-width="2" stroke-linecap="round"></line></svg>
      <div class="auth-title">Findr</div>
    </div>
    <p class="auth-subtitle">Sign in to search across your connected sources.</p>

    <form id="login-form" class="auth-form">
      <label>Username
        <input type="text" id="login-email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" id="login-password" autocomplete="current-password" required>
      </label>
      <div id="login-error" class="auth-error" hidden></div>
      <button type="submit" class="auth-submit">Log in</button>
    </form>

    <p class="auth-hint">Demo login: <code>demouser</code> / <code>password@2050</code></p>
  </div>
</div>

<div class="app-shell hidden" id="app-shell">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#C1502E" stroke-width="2"></circle><line x1="16.2" y1="16.2" x2="21" y2="21" stroke="#C1502E" stroke-width="2" stroke-linecap="round"></line></svg>
      <div style="font-family:'Fraunces',Georgia,serif; font-size:19px; font-weight:600; letter-spacing:0.2px;">Findr</div>
    </div>

    <nav class="sidebar-nav">
      <a href="#" aria-current="page" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:rgba(255,255,255,0.10); color:#F3F1E9; text-decoration:none; font-size:14px; font-weight:600;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        All results
      </a>
      <a href="#" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#C9C6BC; text-decoration:none; font-size:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
        Recent
      </a>
      <a href="#" style="display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; color:#C9C6BC; text-decoration:none; font-size:14px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>
        Saved
      </a>
    </nav>

    <div class="sidebar-sources" style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #8E8B80; padding-left: 12px;">Connected sources</div>
      <div id="sidebar-sources-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
      <div class="connect-wrap">
        <a id="sidebar-connect-trigger" style="font-size:13px; color:#C9C6BC; padding:8px 12px; cursor:pointer;">+ Connect another source</a>
        <div class="connect-menu" id="sidebar-connect-menu"></div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">

    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <h1 style="margin:0; font-family:'Fraunces',Georgia,serif; font-size:28px; font-weight:600; color:#1B1C20;">Search everything</h1>
      <button type="button" class="user-avatar-btn" id="user-avatar" title="Log out"></button>
    </div>

    <!-- SEARCH BAR -->
    <div class="search-bar">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8E8B80" stroke-width="2" style="flex-shrink:0;"><circle cx="11" cy="11" r="7"></circle><line x1="16.2" y1="16.2" x2="21" y2="21"></line></svg>
      <label for="q" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);">Search across your connected sources</label>
      <input id="q" type="text" placeholder="Search emails, messages, pages…" autocomplete="off" style="flex-grow:1; border:none; outline:none; font-size:15px; font-family:inherit; color:#1B1C20; background:transparent; min-width:0;">
      <span class="cmdk-hint" style="font-size:12px; color:#B3AFA2; border:1px solid #E1DDD1; border-radius:6px; padding:3px 7px; flex-shrink:0;">⌘K</span>
    </div>

    <!-- SOURCE / UPLOAD ROW -->
    <div class="source-row">
      <div id="source-row-pills" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;"></div>
      <div class="connect-wrap">
        <button type="button" class="connect-btn" id="row-connect-trigger" style="display:flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 14px; border-radius:999px; background:transparent; border:1px dashed #C7C2B3; font-size:13px; color:#5B5748; cursor:pointer;">
          + Connect source
        </button>
        <div class="connect-menu" id="row-connect-menu"></div>
      </div>
      <!-- POST /sources/upload, one request per file — see specs/file-upload.md. -->
      <input type="file" id="upload-input" multiple accept=".pdf,.docx,.txt,.md,.markdown,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown" class="hidden">
      <button type="button" class="upload-btn" id="upload-btn" style="display:flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 16px; border-radius:999px; background:#C1502E; border:none; font-size:13px; font-weight:600; color:#fff; cursor:pointer; margin-left:auto;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 19V6M6 11l6-6 6 6"></path><path d="M5 20h14"></path></svg>
        Upload files
      </button>
    </div>

    <!-- CONTENT: results + filters -->
    <div class="content-row">

      <!-- RESULTS -->
      <div class="results">
        <div id="results-summary" style="font-size:13px; color:#8E8B80;">Search across your connected sources</div>
        <div id="results-list"></div>
      </div>

      <!-- FILTERS -->
      <div class="filters">
        <div style="font-size:14px; font-weight:700; color:#1B1C20;">Filters</div>

        <div>
          <div style="font-size:12px; font-weight:600; color:#8E8B80; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;">Source</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="src-gmail" type="checkbox" checked style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="src-gmail" style="font-size:13px; color:#1B1C20;">Gmail</label>
            </div>
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="src-slack" type="checkbox" checked style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="src-slack" style="font-size:13px; color:#1B1C20;">Slack</label>
            </div>
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="src-notion" type="checkbox" checked style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="src-notion" style="font-size:13px; color:#1B1C20;">Notion</label>
            </div>
          </div>
        </div>

        <div style="height:1px; background:#EFEBDE;"></div>

        <div>
          <div style="font-size:12px; font-weight:600; color:#8E8B80; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;">File type</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="ft-pdf" type="checkbox" style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="ft-pdf" style="font-size:13px; color:#1B1C20;">PDF</label>
            </div>
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="ft-doc" type="checkbox" style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="ft-doc" style="font-size:13px; color:#1B1C20;">Docs</label>
            </div>
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="ft-sheet" type="checkbox" style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="ft-sheet" style="font-size:13px; color:#1B1C20;">Spreadsheets</label>
            </div>
            <div style="display:flex; align-items:center; gap:9px;">
              <input id="ft-img" type="checkbox" style="width:16px; height:16px; accent-color:#C1502E;">
              <label for="ft-img" style="font-size:13px; color:#1B1C20;">Images</label>
            </div>
          </div>
        </div>

        <div style="height:1px; background:#EFEBDE;"></div>

        <div>
          <div style="font-size:12px; font-weight:600; color:#8E8B80; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px;">Date</div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <button type="button" style="height:30px; padding:0 12px; border-radius:8px; background:#C1502E; color:#fff; border:none; font-size:12px; font-weight:600;">Any time</button>
            <button type="button" style="height:30px; padding:0 12px; border-radius:8px; background:#F6F4EE; color:#5B5748; border:1px solid #E7E3D8; font-size:12px;">This week</button>
            <button type="button" style="height:30px; padding:0 12px; border-radius:8px; background:#F6F4EE; color:#5B5748; border:1px solid #E7E3D8; font-size:12px;">This month</button>
          </div>
        </div>

        <div style="height:1px; background:#EFEBDE;"></div>

        <div style="border:1.5px dashed #D8D3C4; border-radius:10px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3AFA2" stroke-width="2"><path d="M12 19V6M6 11l6-6 6 6"></path><path d="M5 20h14"></path></svg>
          <div style="font-size:12px; color:#8E8B80;">Drop files to add them to search</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- small helpers ----------
  function $(id) { return document.getElementById(id); }

  function api(path, options) {
    return fetch(path, Object.assign({ credentials: "same-origin" }, options || {}));
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // FTS5 snippet() was asked to bracket matches with [ ]; escape everything
  // else first so real document content can never inject markup, then turn
  // just those two characters we control into <strong> highlighting.
  function renderSnippet(snippet) {
    return escapeHtml(snippet).split("[").join("<strong>").split("]").join("</strong>");
  }

  function relativeTime(iso) {
    if (!iso) return "";
    var diffMs = Date.now() - new Date(iso).getTime();
    var mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hours = Math.floor(mins / 60);
    if (hours < 24) return hours + "h ago";
    var days = Math.floor(hours / 24);
    if (days === 1) return "Yesterday";
    if (days < 7) return days + " days ago";
    var weeks = Math.floor(days / 7);
    return weeks === 1 ? "1 week ago" : weeks + " weeks ago";
  }

  function initials(email) {
    var name = (email || "").split("@")[0];
    return (name.slice(0, 2) || "??").toUpperCase();
  }

  // ---------- source metadata (icons/colors per connector) ----------
  function iconMail(color) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>';
  }
  function iconGrid(color) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>';
  }
  function iconPage(color) {
    return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>';
  }

  var SOURCE_META = {
    gmail: { label: "Gmail", color: "#3D4E82", bg: "#EEF1F9", icon: iconMail },
    slack: { label: "Slack", color: "#6B4E9A", bg: "#F1EAF7", icon: iconGrid },
    notion: { label: "Notion", color: "#3A3A38", bg: "#EDECE8", icon: iconPage },
    file: { label: "File", color: "#C1502E", bg: "#FBEDE7", icon: iconPage }
  };
  // Connectable via OAuth from the "+ Connect source" menus. Uploaded files
  // aren't in here: they get their own button and connection.
  var ALL_SOURCE_TYPES = ["gmail", "slack", "notion"];

  function sourceMeta(type) {
    return SOURCE_META[type] || { label: type, color: "#5C6B93", bg: "#EEF1F9", icon: iconMail };
  }

  var STATUS_DOT = { active: "#5CB88A", needs_reauth: "#E0A63A", error: "#D2555A", disconnected: "#B3AFA2" };
  var STATUS_LABEL = { active: "Synced", needs_reauth: "Needs reauth", error: "Error", disconnected: "Disconnected" };

  // ---------- state ----------
  var state = { sources: [] };

  // ---------- auth ----------
  function checkAuth() {
    api("/auth/me").then(function (res) {
      if (res.ok) {
        res.json().then(onAuthenticated);
      } else {
        showLogin();
      }
    });
  }

  function showLogin() {
    $("login-screen").classList.remove("hidden");
    $("app-shell").classList.add("hidden");
  }

  function onAuthenticated(user) {
    $("login-screen").classList.add("hidden");
    $("app-shell").classList.remove("hidden");
    var avatar = $("user-avatar");
    avatar.textContent = initials(user.email);
    avatar.title = user.email + " — click to log out";
    loadSources();
    renderResults(null);
  }

  function showAuthError(id, message) {
    var el = $(id);
    el.textContent = message;
    el.hidden = false;
  }

  function clearAuthErrors() {
    var el = $("login-error");
    el.hidden = true;
    el.textContent = "";
  }

  $("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    clearAuthErrors();
    var email = $("login-email").value;
    var password = $("login-password").value;
    api("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    }).then(function (res) {
      if (res.ok) {
        checkAuth();
      } else {
        showAuthError("login-error", "Incorrect username or password.");
      }
    });
  });

  $("user-avatar").addEventListener("click", function () {
    if (!window.confirm("Log out?")) return;
    api("/auth/logout", { method: "POST" }).then(function () { window.location.reload(); });
  });

  // ---------- connected sources (sidebar + source row + connect menus) ----------
  function loadSources() {
    api("/sources").then(function (res) {
      if (!res.ok) return;
      return res.json();
    }).then(function (sources) {
      state.sources = sources || [];
      renderSidebarSources();
      renderSourceRowPills();
      renderConnectMenus();
    });
  }

  function disconnectSource(id) {
    if (!window.confirm("Disconnect this source?")) return;
    api("/sources/" + id, { method: "DELETE" }).then(loadSources);
  }

  function resyncSource(id, button) {
    button.disabled = true;
    button.classList.add("spinning");
    api("/sources/" + id + "/sync", { method: "POST" })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (body) {
            window.alert("Sync failed: " + (body.detail || res.status));
          });
        }
      })
      .catch(function () {
        window.alert("Sync request failed — check the server is still running.");
      })
      .then(loadSources);
  }

  function activeConnections() {
    return state.sources.filter(function (s) { return s.status !== "disconnected"; });
  }

  function renderSidebarSources() {
    var container = $("sidebar-sources-list");
    var connections = activeConnections();
    if (connections.length === 0) {
      container.innerHTML = '<div style="font-size:12px; color:#8E8B80; padding:4px 12px;">No sources connected yet</div>';
      return;
    }
    container.innerHTML = connections.map(function (s) {
      var meta = sourceMeta(s.source_type);
      var label = s.display_name || meta.label;
      // last_error is only meaningful once something has actually gone
      // wrong — shown as a tooltip on the status text rather than inline,
      // so a healthy sidebar isn't cluttered.
      var statusTitle = s.last_error ? escapeHtml(s.last_error) : "";
      return (
        '<div class="sidebar-source-row">' +
          '<span class="status-dot" style="background:' + (STATUS_DOT[s.status] || STATUS_DOT.disconnected) + '"></span>' +
          '<span class="sidebar-source-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span>' +
          '<span class="sidebar-source-status" title="' + statusTitle + '">' + (STATUS_LABEL[s.status] || s.status) + '</span>' +
          // Uploaded files have nothing to resync or disconnect — files are
          // removed one at a time from their search results instead.
          (s.source_type === "file" ? "" :
            '<button type="button" class="resync-btn" data-id="' + s.id + '" aria-label="Resync ' + escapeHtml(label) + '" title="Resync now">↻</button>' +
            '<button type="button" class="disconnect-btn" data-id="' + s.id + '" aria-label="Disconnect ' + escapeHtml(label) + '">×</button>') +
        '</div>'
      );
    }).join("");
    Array.prototype.forEach.call(container.querySelectorAll(".resync-btn"), function (btn) {
      btn.addEventListener("click", function () { resyncSource(btn.getAttribute("data-id"), btn); });
    });
    Array.prototype.forEach.call(container.querySelectorAll(".disconnect-btn"), function (btn) {
      btn.addEventListener("click", function () { disconnectSource(btn.getAttribute("data-id")); });
    });
  }

  function renderSourceRowPills() {
    var container = $("source-row-pills");
    var connections = activeConnections();
    container.innerHTML = connections.map(function (s) {
      var meta = sourceMeta(s.source_type);
      var label = s.display_name || meta.label;
      return (
        '<div class="source-pill">' + meta.icon(meta.color) +
          '<span>' + escapeHtml(label) + '</span>' +
          '<span class="pill-dot" style="background:' + (STATUS_DOT[s.status] || STATUS_DOT.disconnected) + '"></span>' +
        '</div>'
      );
    }).join("");
  }

  function renderConnectMenus() {
    var connectedTypes = {};
    activeConnections().forEach(function (s) { connectedTypes[s.source_type] = true; });
    var missing = ALL_SOURCE_TYPES.filter(function (t) { return !connectedTypes[t]; });

    var menuHtml = missing.map(function (t) {
      var meta = sourceMeta(t);
      return '<a class="connect-menu-item" href="/sources/' + t + '/connect">' + meta.icon(meta.color) + '<span>' + meta.label + '</span></a>';
    }).join("");

    [["sidebar-connect-trigger", "sidebar-connect-menu"], ["row-connect-trigger", "row-connect-menu"]].forEach(function (pair) {
      var trigger = $(pair[0]);
      var menu = $(pair[1]);
      menu.innerHTML = menuHtml;
      trigger.classList.toggle("hidden", missing.length === 0);
    });
  }

  function setupDropdown(triggerId, menuId) {
    var trigger = $(triggerId);
    var menu = $(menuId);
    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      var willOpen = !menu.classList.contains("open");
      document.querySelectorAll(".connect-menu.open").forEach(function (m) { m.classList.remove("open"); });
      if (willOpen) menu.classList.add("open");
    });
  }
  setupDropdown("sidebar-connect-trigger", "sidebar-connect-menu");
  setupDropdown("row-connect-trigger", "row-connect-menu");
  document.addEventListener("click", function () {
    document.querySelectorAll(".connect-menu.open").forEach(function (m) { m.classList.remove("open"); });
  });

  // ---------- search ----------
  function renderResults(hits) {
    var summary = $("results-summary");
    var list = $("results-list");

    if (hits === null) {
      summary.textContent = "Search across your connected sources";
      list.innerHTML = "";
      return;
    }

    if (hits.length === 0) {
      summary.textContent = "No results";
      list.innerHTML = '<div class="empty-state">No matches. Try a different search term.</div>';
      return;
    }

    var sourceCount = {};
    hits.forEach(function (h) { sourceCount[h.source_type] = true; });
    var sourceTotal = Object.keys(sourceCount).length;
    summary.textContent = hits.length + (hits.length === 1 ? " result" : " results") +
      " across " + sourceTotal + (sourceTotal === 1 ? " source" : " sources");

    list.innerHTML = hits.map(function (hit) {
      var meta = sourceMeta(hit.source_type);
      var title = hit.subject || "(no subject)";
      var fromLine = hit.sender ? "From " + escapeHtml(hit.sender) + " · " : "";
      // Clickable (opens the real item in a new tab) only when the backend
      // could build a deep link for this source — see search_router.py's
      // _source_url. Falls back to a plain, non-clickable card otherwise.
      var tag = hit.url ? "a" : "div";
      var openAttrs = hit.url
        ? ' href="' + escapeHtml(hit.url) + '" target="_blank" rel="noopener noreferrer"'
        : "";
      return (
        '<' + tag + ' class="result-card"' + openAttrs + '>' +
          '<div class="result-icon" style="background:' + meta.bg + '">' + meta.icon(meta.color) + '</div>' +
          '<div style="min-width:0;">' +
            '<div class="result-title-row">' +
              '<span class="result-title">' + escapeHtml(title) + '</span>' +
              '<span class="result-time">' + relativeTime(hit.sent_at) + '</span>' +
            '</div>' +
            '<div class="result-snippet">' + fromLine + renderSnippet(hit.snippet) + '</div>' +
            '<div class="result-meta-row">' +
              '<span class="result-badge" style="color:' + meta.color + '; background:' + meta.bg + ';">' + meta.icon(meta.color) + ' ' + meta.label + '</span>' +
              (hit.recipients ? '<span class="result-context">' + escapeHtml(hit.recipients) + '</span>' : '') +
              (hit.source_type === "file"
                ? '<button type="button" class="delete-doc-btn" data-id="' + hit.document_id + '" aria-label="Delete ' + escapeHtml(title) + '">Delete</button>'
                : '') +
            '</div>' +
          '</div>' +
        '</' + tag + '>'
      );
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll(".delete-doc-btn"), function (btn) {
      btn.addEventListener("click", function () { deleteDocument(btn.getAttribute("data-id")); });
    });
  }

  function deleteDocument(id) {
    if (!window.confirm("Delete this uploaded file? It will be removed from search.")) return;
    api("/documents/" + id, { method: "DELETE" }).then(function (res) {
      if (!res.ok && res.status !== 404) window.alert("Delete failed (" + res.status + ").");
      refreshSearch();
    });
  }

  function refreshSearch() {
    var value = $("q").value.trim();
    if (value) runSearch(value);
  }

  // ---------- uploads ----------
  $("upload-btn").addEventListener("click", function () { $("upload-input").click(); });

  $("upload-input").addEventListener("change", function () {
    var input = $("upload-input");
    var files = Array.prototype.slice.call(input.files || []);
    input.value = "";
    if (files.length === 0) return;

    var button = $("upload-btn");
    button.disabled = true;
    var failures = [];
    // Sequential, one request per file — each upload embeds its text
    // server-side, so there's no benefit to firing them in parallel.
    files.reduce(function (chain, file, i) {
      return chain.then(function () {
        button.lastChild.textContent = " Uploading " + (i + 1) + "/" + files.length + "…";
        var form = new FormData();
        form.append("file", file);
        return api("/sources/upload", { method: "POST", body: form }).then(function (res) {
          if (res.ok) return;
          return res.json().catch(function () { return {}; }).then(function (body) {
            failures.push(file.name + ": " + (body.detail || res.status));
          });
        }).catch(function () {
          failures.push(file.name + ": upload request failed");
        });
      });
    }, Promise.resolve()).then(function () {
      button.disabled = false;
      button.lastChild.textContent = " Upload files";
      if (failures.length) window.alert("Some files couldn't be uploaded:\n\n" + failures.join("\n"));
      loadSources();
      refreshSearch();
    });
  });

  function runSearch(query) {
    api("/search?q=" + encodeURIComponent(query)).then(function (res) {
      if (!res.ok) return null;
      return res.json();
    }).then(function (body) {
      if (body) renderResults(body.results);
    });
  }

  var searchTimer = null;
  $("q").addEventListener("input", function () {
    window.clearTimeout(searchTimer);
    var value = $("q").value.trim();
    if (!value) { renderResults(null); return; }
    searchTimer = window.setTimeout(function () { runSearch(value); }, 300);
  });

  checkAuth();
})();
</script>

</body>
</html>
