[project]
name = "findr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "tenacity>=8.2",
]

[project.scripts]
findr = "findr:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
