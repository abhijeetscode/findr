services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FINDR_DATABASE_URL: postgresql+psycopg://findr:findr@postgres:5432/findr
      FINDR_ELASTICSEARCH_URL: http://elasticsearch:9200
      FINDR_UPLOAD_STORAGE_ROOT: /data/uploads
      FINDR_REDIS_URL: redis://redis:6379/0
      # Logs go to files only, one per process (specs/logging-telemetry.md §4.6).
      FINDR_LOG_DIR: /data/logs
    volumes:
      - findr_uploads_data:/data/uploads
      - findr_model_cache:/data/hf-cache
      - findr_logs_data:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Processes uploads in the background: OCR, tables, chunking, embeddings
  # (specs/upload-chunking.md §5). One process, one upload at a time — the
  # work is CPU-bound and needs ~3-4GB while running. More throughput, memory
  # permitting: `docker compose up -d --scale worker=2`.
  worker:
    build: .
    command:
      [
        "taskiq", "worker", "findr.adapters.taskiq.tasks:broker",
        "--workers", "1",
        "--max-async-tasks", "1",
        "--max-prefetch", "1",
        "--ack-type", "when_executed",
      ]
    env_file:
      - .env
    environment:
      FINDR_DATABASE_URL: postgresql+psycopg://findr:findr@postgres:5432/findr
      FINDR_ELASTICSEARCH_URL: http://elasticsearch:9200
      FINDR_UPLOAD_STORAGE_ROOT: /data/uploads
      FINDR_REDIS_URL: redis://redis:6379/0
      # Logs go to files only, one per process (specs/logging-telemetry.md §4.6).
      FINDR_LOG_DIR: /data/logs
    volumes:
      - findr_uploads_data:/data/uploads
      - findr_model_cache:/data/hf-cache
      - findr_logs_data:/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Upload job queue. Append-only persistence so queued jobs survive a
  # restart; capped at 64MB with noeviction, so it refuses new jobs rather
  # than silently dropping queued ones (~190 bytes per job message).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - findr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: findr
      POSTGRES_PASSWORD: findr
      POSTGRES_DB: findr
    ports:
      - "5432:5432"
    volumes:
      - findr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findr"]
      interval: 2s
      timeout: 5s
      retries: 15

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - findr_es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  findr_postgres_data:
  findr_es_data:
  findr_uploads_data:
  findr_model_cache:
  findr_redis_data:
  findr_logs_data:
